name: Build and update Portainer

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger_portainer:
        description: "Disparar webhook do Portainer depois do build"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wittemberg/sistema-cobrancas-email

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  update-portainer:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger Portainer webhook
        env:
          ENABLE_PORTAINER_DEPLOY: ${{ secrets.ENABLE_PORTAINER_DEPLOY }}
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          TRIGGER_PORTAINER: ${{ inputs.trigger_portainer || 'false' }}
        run: |
          if [ "$ENABLE_PORTAINER_DEPLOY" != "true" ] && [ "$TRIGGER_PORTAINER" != "true" ]; then
            echo "Portainer deploy disabled."
            exit 0
          fi

          test -n "$PORTAINER_WEBHOOK_URL"
          curl --fail --show-error --silent --request POST "$PORTAINER_WEBHOOK_URL"
