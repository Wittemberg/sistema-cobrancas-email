<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background:#f4f8fc; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">

  <div style="max-width:720px; margin:28px auto; background:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #d9e6f2; box-shadow:0 2px 8px rgba(0,0,0,0.05);">

    <!-- Cabeçalho -->
    <div style="background:linear-gradient(135deg,#0b4a8b,#2da8e0); padding:28px 32px; color:#ffffff;">
      <div style="font-size:34px; font-weight:bold; letter-spacing:1px; line-height:1;">
        TECNOTEAM
      </div>
      <div style="font-size:12px; margin-top:8px; color:#d9f3ff; text-transform:uppercase; letter-spacing:1.2px;">
        Tecnologia da Informação
      </div>
    </div>

    <!-- Faixa decorativa -->
    <div style="height:6px; background:linear-gradient(90deg,#79d2ff,#2da8e0,#0b4a8b);"></div>

    <!-- Conteúdo principal -->
    <div style="padding:32px; font-size:15px; line-height:1.75; color:#2d3748;">
      {{corpo_email}}
    </div>

    <!-- Bloco institucional -->
    <div style="margin:0 32px 24px 32px; background:#eef7fd; border-left:4px solid #2da8e0; padding:16px 20px; border-radius:6px;">
      <div style="font-size:13px; font-weight:bold; color:#0b4a8b;">
        TECNOTEAM Tecnologia da Informação
      </div>
      <div style="font-size:12px; color:#5f6f82; margin-top:4px;">
        Soluções em tecnologia, infraestrutura e suporte corporativo.
      </div>
    </div>

    <!-- Rodapé -->
    <div style="background:#f7fafc; border-top:1px solid #d9e6f2; padding:18px 32px;">
      <div style="font-size:12px; color:#6b7280;">
        Email automático referente a {{mes_referencia}}/{{ano_referencia}}.
      </div>
      <div style="font-size:11px; color:#9aa5b1; margin-top:4px;">
        Esta mensagem foi enviada automaticamente por {{empresa_nome}}.
      </div>
    </div>

  </div>

</body>
</html>
