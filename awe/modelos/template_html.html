<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background:#f3f7fb; font-family:Arial, Helvetica, sans-serif; color:#1f2d3d;">

    <div style="background:linear-gradient(135deg,#0077a8,#071d5f); padding:26px 28px; color:#ffffff;">
      <div style="font-size:28px; font-weight:bold; letter-spacing:1px;">
        AWE
      </div>
      <div style="font-size:13px; margin-top:4px; color:#c9f2ff;">
        CLOUD SOLUTION
      </div>
    </div>

    <div style="height:6px; background:linear-gradient(90deg,#78c9d6,#0077a8,#071d5f);"></div>

    <div style="padding:28px; font-size:15px; line-height:1.7;">
      {{corpo_email}}
    </div>

    <div style="background:#eef6fb; padding:18px 28px; border-top:1px solid #d8e4ef;">
      <div style="font-size:13px; color:#071d5f; font-weight:bold;">
        AWE Cloud Solution
      </div>
      <div style="font-size:12px; color:#5b6b7a; margin-top:4px;">
        Email automático referente a {{mes_referencia}}/{{ano_referencia}}.
      </div>
    </div>

  </div>

</html>
